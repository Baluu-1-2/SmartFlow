<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#heroGrad)"/>
  <!-- Ambient circles -->
  <circle cx="200" cy="100" r="140" fill="#a855f7" opacity="0.3" filter="url(#glow)"/>
  <circle cx="950" cy="280" r="180" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>
  <circle cx="600" cy="350" r="120" fill="#38bdf8" opacity="0.2" filter="url(#glow)"/>

  <!-- Geometric UI cards illustration -->
  <g transform="translate(680, 50)" opacity="0.85">
    <!-- Back card -->
    <rect x="40" y="20" width="380" height="220" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Front card -->
    <rect x="0" y="60" width="360" height="230" rx="20" fill="#1e1b4b" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <!-- Checklist items inside front card -->
    <rect x="25" y="90" width="20" height="20" rx="6" fill="#10b981"/>
    <path d="M29 100 L33 104 L40 94" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="94" width="180" height="12" rx="6" fill="#ffffff" opacity="0.9"/>

    <rect x="25" y="130" width="20" height="20" rx="6" fill="#6366f1"/>
    <path d="M29 140 L33 144 L40 134" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="134" width="220" height="12" rx="6" fill="#ffffff" opacity="0.75"/>

    <rect x="25" y="170" width="20" height="20" rx="6" fill="rgba(255,255,255,0.15)"/>
    <rect x="60" y="174" width="140" height="12" rx="6" fill="#ffffff" opacity="0.5"/>

    <rect x="25" y="210" width="20" height="20" rx="6" fill="rgba(255,255,255,0.15)"/>
    <rect x="60" y="214" width="160" height="12" rx="6" fill="#ffffff" opacity="0.35"/>

    <!-- Progress indicator pill -->
    <rect x="25" y="250" width="310" height="10" rx="5" fill="rgba(255,255,255,0.1)"/>
    <rect x="25" y="250" width="210" height="10" rx="5" fill="#a855f7"/>
  </g>

  <!-- Left typography badge illustration -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="32" y="19" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SMARTFLOW AI</text>
  </g>
</svg>
